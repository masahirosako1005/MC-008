<!doctype html>
<html lang="ja" data-text-scale="normal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e6bff" />
    <meta name="description" content="この街が、クエストになる。大阪・南森町周辺の再訪促進アプリ「まちクエ」（PoC）" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>南森町 まちクエ（PoC）</title>
    <!-- 起動スプラッシュ（JS より先に出す。App.start が #app の中身を差し替えると消え、開始画面 LaunchScreen.ts が続きを動かす） -->
    <link rel="stylesheet" href="/src/presentation/screens/Launch/splash.css" />
  </head>
  <body>
    <div id="app">
      <!-- ロゴの形は src/presentation/screens/Launch/launchLogo.ts と同じ。変えるときは両方そろえる -->
      <div class="splash" data-testid="splash" role="status" aria-label="まちクエ を起動しています">
        <div class="splash__phone">
          <div class="splash__stage">
            <div class="splash__sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="splash__emblem">
              <span class="splash__rays"></span>
              <span class="splash__ring"></span><span class="splash__ring"></span>
              <svg class="splash__logo" viewBox="0 0 120 120" aria-hidden="true">
                <ellipse class="splash__logo-shadow" cx="60" cy="113" rx="17" ry="4" />
                <path class="splash__logo-pin" d="M60 110C51 96 22 79 22 50a38 38 0 0 1 76 0c0 29-29 46-38 60z" />
                <g class="splash__logo-town">
                  <rect x="35" y="49" width="14" height="19" rx="2.5" />
                  <rect x="51" y="34" width="18" height="34" rx="2.5" />
                  <rect x="71" y="43" width="14" height="25" rx="2.5" />
                </g>
                <rect class="splash__logo-ground" x="31" y="66" width="58" height="4.5" rx="2.25" />
                <g class="splash__logo-win">
                  <rect x="55" y="39" width="4" height="4" rx="1" />
                  <rect x="61" y="39" width="4" height="4" rx="1" />
                  <rect x="55" y="46" width="4" height="4" rx="1" />
                  <rect x="61" y="46" width="4" height="4" rx="1" />
                  <rect x="58" y="57" width="4" height="9" rx="1" />
                  <rect x="39" y="54" width="6" height="4" rx="1" />
                  <rect x="75" y="48" width="6" height="4" rx="1" />
                  <rect x="75" y="55" width="6" height="4" rx="1" />
                </g>
                <g class="splash__logo-sprout">
                  <path class="splash__logo-stem" d="M60 34V25" />
                  <path d="M60 28c-1-5-5-8-10-7 1 5 5 8 10 7z" />
                  <path d="M60 26c1-6 6-9 12-8-1 6-6 9-12 8z" />
                </g>
              </svg>
            </div>
            <p class="splash__place">南森町</p>
            <p class="splash__name" aria-hidden="true"><span>ま</span><span>ち</span><span>ク</span><span>エ</span></p>
            <p class="splash__tagline">この街が、クエストになる。</p>
            <div class="splash__gauge" aria-hidden="true">
              <span class="splash__gauge-label">NOW LOADING</span><span class="splash__gauge-pct"></span>
              <span class="splash__gauge-bar"><span class="splash__gauge-fill"></span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
